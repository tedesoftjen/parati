<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi amor ૮₍˶ᵔ ᵕ ᵔ˶ ₎ა</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Comfortaa", sans-serif;
        }

        body {
            min-height: 100vh;

            background-image:
                linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.35)),
                url("fondo.png");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow-x: hidden;
            padding: 30px 15px;

            color: white;
        }

        
        .heart {
            position: fixed;
            bottom: -50px;

            font-size: 25px;

            animation: subir 8s linear infinite;

            opacity: 0.7;

            pointer-events: none;
            z-index: 1;
        }

        .heart:nth-child(1) {
            left: 10%;
            animation-delay: 1s;
        }

        .heart:nth-child(2) {
            left: 30%;
            animation-delay: 3s;
        }

        .heart:nth-child(3) {
            left: 50%;
            animation-delay: 0s;
        }

        .heart:nth-child(4) {
            left: 70%;
            animation-delay: 2s;
        }

        .heart:nth-child(5) {
            left: 90%;
            animation-delay: 4s;
        }

        @keyframes subir {

            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            20% {
                opacity: 0.8;
            }

            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }


        .container {
            width: 100%;
            max-width: 900px;

            display: flex;
            flex-direction: column;
            align-items: center;

            position: relative;
            z-index: 5;
        }

        
        .title {
            text-align: center;

            font-size: 30px;
            font-weight: 600;

            margin-bottom: 30px;

            text-shadow:
                0 3px 10px rgba(0, 0, 0, 0.6);

            animation: aparecer 1.5s ease;
        }

        @keyframes aparecer {

            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* SOBRE */

        .envelope-container {
            position: relative;

            width: 330px;
            height: 230px;

            cursor: pointer;

            perspective: 1000px;

            animation: flotar 3s ease-in-out infinite;

            z-index: 10;
        }

        @keyframes flotar {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }
        }


        /* CUERPO DEL SOBRE */

        .envelope {
            position: absolute;

            width: 100%;
            height: 100%;

            background: #7f6657ed;

            border-radius: 10px;

            box-shadow:
                0 15px 35px rgba(0, 0, 0, 0.35);

            overflow: hidden;
        }


        /* TRIÁNGULO INFERIOR */

        .envelope::before {

            content: "";

            position: absolute;

            bottom: 0;
            left: 0;

            width: 0;
            height: 0;

            border-left: 165px solid transparent;
            border-right: 165px solid transparent;

            border-bottom: 120px solid #7f6657ed;

            z-index: 3;
        }

        
        /* SOLAPA DEL SOBRE */

        .flap {

            position: absolute;

            top: 0;
            left: 0;

            width: 0;
            height: 0;

            border-left: 165px solid transparent;
            border-right: 165px solid transparent;
            border-top: 125px solid #7f6657ed;

            transform-origin: top;

            transition: transform 0.8s ease;

            z-index: 6;
        }


        /* CORAZÓN DEL SOBRE */

        .envelope-heart {

            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            font-size: 48px;

            z-index: 8;

            transition: 0.5s;

            text-shadow:
                0 3px 10px rgb(193, 170, 162);
        }

        .envelope-container:hover .envelope-heart {
            transform: translate(-50%, -50%) scale(1.15);
        }


        /* TEXTO DEL SOBRE */

        .envelope-text {

            position: absolute;

            bottom: 18px;
            left: 0;
            right: 0;

            text-align: center;

            color: white;

            font-size: 15px;

            font-weight: 600;

            z-index: 10;
        }


        /* ============================= */
        /* CARTA */
        /* ============================= */

        .letter {

            position: absolute;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%)
                scale(0.5);

            width: min(90vw, 750px);

            max-height: 85vh;

            background:
                linear-gradient(
                    rgba(255, 250, 244, 0.97),
                    #d0cecf
                );

            color: #633f4b;

            border-radius: 25px;

            padding: 35px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.45);

            opacity: 0;

            visibility: hidden;

            overflow-y: auto;

            transition:
                opacity 0.7s ease,
                transform 0.7s ease,
                visibility 0.7s;

            z-index: 30;
        }


        /* CUANDO LA CARTA ESTÁ ABIERTA */

        .letter.active {

            opacity: 1;

            visibility: visible;

            transform:
                translate(-50%, -50%)
                scale(1);
        }


        /* TÍTULO DE LA CARTA */
       
        .letter h2 {

            text-align: center;

            color: #3a121f;

            margin-bottom: 20px;

            font-size: 28px;
        }


        /* ÁREA PARA ESCRIBIR */
    
        .message {

            width: 100%;

            min-height: 180px;

            resize: vertical;

            border: 2px solid #3a121f;

            border-radius: 18px;

            padding: 18px;

            outline: none;

            font-size: 16px;

            line-height: 1.7;

            color: #633f4b;

            background: rgba(255, 255, 255, 0.75);

            transition: 0.3s;
        }

        .message:focus {

            border-color: #3a121f;

            box-shadow:
                0 0 12px rgba(11, 11, 11, 0.982);
        }


        /* GALERÍA */
   
        .gallery-title {

            text-align: center;

            margin-top: 25px;
            margin-bottom: 15px;

            color: #3a121f;
        }

        .gallery {

            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(150px, 1fr));

            gap: 15px;
        }

        .gallery img {

            width: 100%;
            height: 180px;

            object-fit: cover;

            border-radius: 18px;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.18);

            transition: transform 0.3s ease;
        }

        .gallery img:hover {

            transform: scale(1.04);
        }


        /* BOTONES */
   
        .buttons {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 15px;

            flex-wrap: wrap;

            margin-top: 25px;
        }

        .btn {

            border: none;

            padding: 13px 22px;

            border-radius: 30px;

            background:
                linear-gradient(
                    135deg,
                    #d0cfcf,
                    #d0cfcf
                );

            color: #3a121f;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.2);

            transition:
                transform 0.3s,
                box-shadow 0.3s;
        }

        .btn:hover {

            transform: translateY(-3px);

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.25);
        }


        /* BOTÓN CERRAR */

        .close-btn {

            background:
                linear-gradient(
                    135deg,
                    #d0cfcf,
                    #d0cfcf
                );
        }



        /* TEXTO INFERIOR */

        .instruction {

            margin-top: 25px;

            text-align: center;

            font-size: 15px;

            text-shadow:
                0 2px 5px rgba(0, 0, 0, 0.5);

            animation: aparecer 2s ease;
        }


        /* PANTALLA OSCURA AL ABRIR */

        .overlay {

            position: fixed;

            inset: 0;

            background:
                rgba(0, 0, 0, 0.55);

            opacity: 0;

            visibility: hidden;

            transition: 0.5s;

            z-index: 20;
        }

        .overlay.active {

            opacity: 1;

            visibility: visible;
        }


        /* RESPONSIVE */

        @media (max-width: 600px) {

            body {
                padding: 20px 10px;
            }

            .title {
                font-size: 23px;
            }

            .envelope-container {

                width: 280px;
                height: 195px;
            }

            .envelope::before {

                border-left-width: 140px;
                border-right-width: 140px;
                border-bottom-width: 105px;
            }

            .envelope::after {

                border-left-width: 140px;
                border-top-width: 100px;
            }

            .flap {

                border-left-width: 140px;
                border-right-width: 140px;
                border-top-width: 105px;
            }

            .letter {

                padding: 22px;

                width: 94vw;

                max-height: 90vh;
            }

            .letter h2 {
                font-size: 23px;
            }

            .gallery img {
                height: 140px;
            }
        }

    </style>

</head>


<body>


    <!-- CORAZONES DECORATIVOS -->

    <div class="heart">❤️‍🩹</div>
    <div class="heart">🩷</div>
    <div class="heart">❤️‍🔥</div>
    <div class="heart">💗</div>
    <div class="heart">💖</div>


    <!-- OSCURECER EL FONDO -->
    <div class="overlay" id="overlay"></div>


    <!-- CONTENIDO PRINCIPAL -->

    <main class="container">

        <h1 class="title">
            El amor no avisa cuándo llega; simplemente un día te das cuenta de que alguien ya forma parte de tus días.

        </h1>


        <!-- SOBRE -->

        <div
            class="envelope-container"
            id="envelopeButton"
            title="Haz clic para abrir la carta"
        >

            <div class="envelope">

                <div class="flap"></div>

                <div class="envelope-heart">
                    💌
                </div>

                <div class="envelope-text">
                    Haz clic para abrir
                </div>

            </div>

        </div>


        <h1 class="instruction">
            ¿Te sorprendí?
        </h1>


    </main>


    <!-- ============================= -->
    <!-- CARTA -->
    <!-- ============================= -->

    <section class="letter" id="letter">

        <h2>
          Hola amor
        </h2>


        <!-- MENSAJE -->

        <textarea
            class="message"
            id="message"
            placeholder="Cuando pienso en ¿qué probabilidad había? Un sábado, entre las 6:30 y 7 am, en la misma ruta, vestido de azul, el gemelo bueno...Ninguna. Y si tú no me hubieses escrito o si yo hubiese dejado de responder. 
Me gusta creer que estábamos destinados a encontrarnos, conocernos, mejorar como personas y estar juntos hasta que Dios nos lo permita.
En retrospectiva, todo lo que hemos hablado, compartido y sentido ha sido maravilloso. Gracias por tu esfuerzo, por la paciencia y por hacerme tan feliz.

Con amor, Jen."
        ></textarea>


        <!-- FOTOS -->

        <h2 class="gallery-title">
            📸 Algunos de nuestros recuerdos
        </h2>


        <div class="gallery">

            <img
                src="foto1.jpeg"
                alt="Nuestra foto 1"
            >

            <img
                src="foto2.jpeg"
                alt="Nuestra foto 2"
            >

            <img
                src="foto3.jpeg"
                alt="Nuestra foto 3"
            >

        </div>

        <div class="buttons">

            <button
                class="btn"
                id="musicButton"
            >
                ▷ Reproducir canción
            </button>


            <button
                class="btn close-btn"
                id="closeButton"
            >
                ✕ Cerrar
            </button>

        </div>

    </section>

    <audio
        id="audio"
        src="todo contigo-alvaro de luna.mp3"
    ></audio>

    <script>

        const envelopeButton =
            document.getElementById("envelopeButton");

        const letter =
            document.getElementById("letter");

        const overlay =
            document.getElementById("overlay");

        const closeButton =
            document.getElementById("closeButton");

        const musicButton =
            document.getElementById("musicButton");

        const audio =
            document.getElementById("audio");

        envelopeButton.addEventListener("click", () => {

            letter.classList.add("active");

            overlay.classList.add("active");

        });

        closeButton.addEventListener("click", () => {

            letter.classList.remove("active");

            overlay.classList.remove("active");

        });

        overlay.addEventListener("click", () => {

            letter.classList.remove("active");

            overlay.classList.remove("active");

        });

        musicButton.addEventListener("click", () => {

            if (audio.paused) {

                audio.play();

                musicButton.textContent =
                    "|| Pausar canción";

            } else {

                audio.pause();

                musicButton.textContent =
                    "▷ Reproducir canción";

            }

        });

        audio.addEventListener("ended", () => {

            musicButton.textContent =
                "▷ Reproducir canción";
        });

    </script>

</body>

</html>
